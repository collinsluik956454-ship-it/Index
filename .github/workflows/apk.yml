name: Looplijst APK bouwen

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - loader.html
      - icons/**
      - android-extra/**

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vaste handtekening zetten (zodat updates over de oude app heen kunnen)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Web-bestanden klaarzetten
        run: |
          mkdir www
          cp loader.html www/index.html
          cp index.html www/app.html

      - name: Android-project maken
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Looplijst" nl.collin.looplijst --web-dir www
          npx cap add android
          cp -r icons/res/* android/app/src/main/res/
          cp android-extra/MainActivity.java android/app/src/main/java/nl/collin/looplijst/MainActivity.java
          cp android-extra/patch_manifest.py patch_manifest.py && python3 patch_manifest.py
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: APK bouwen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK klaarzetten
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Looplijst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Looplijst-APK
          path: Looplijst.apk

      - name: Release maken (directe downloadlink)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Looplijst.apk --title "Looplijst APK ${{ github.run_number }}" --notes "Download Looplijst.apk en installeer hem op je telefoon."
